function uid(){if(crypto.randomUUID)return crypto.randomUUID();const a=new Uint8Array(16);crypto.getRandomValues(a);return Array.from(a,n=>n.toString(16).padStart(2,'0')).join('');}
function today(){const p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),get=t=>p.find(x=>x.type===t).value;return get('year')+'-'+get('month')+'-'+get('day');}
function dateTH(v){if(!v)return '—';const d=new Date(v+'T12:00:00+07:00');return isNaN(d)?v:d.toLocaleDateString('th-TH',{timeZone:'Asia/Bangkok',day:'numeric',month:'short',year:'numeric'});}
function fullName(p){return (p.prefix||'')+(p.firstName||'')+' '+(p.lastName||'');}
function toast(v,error=false){$('toast').textContent=v;$('toast').className='toast'+(error?' error':'');$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,6500);}
function confirmAction(title,text){return new Promise(resolve=>{let done=false;const d=$('dialog');$('dialogTitle').textContent=title;$('dialogText').textContent=text;const end=v=>{if(done)return;done=true;d.close();resolve(v);};$('dialogYes').onclick=()=>end(true);$('dialogNo').onclick=()=>end(false);d.oncancel=e=>{e.preventDefault();end(false);};d.showModal();});}
function validUrl(v){try{const u=new URL(v);return u.protocol==='https:'&&u.hostname==='script.google.com'&&/^\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(u.pathname)&&!u.search&&!u.hash;}catch(e){return false;}}

const pending=new Map();window.addEventListener('message',e=>{if(e.origin!=='https://script.google.com'&&!/^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/.test(e.origin))return;const d=e.data;if(d?.type==='TLM206_RESPONSE'&&pending.has(d.requestId))pending.get(d.requestId)(d.result);});
function api(action,data={}){if(!validUrl(apiUrl))return Promise.reject(Error('กรุณาใส่ URL GAS ในหน้าตั้งค่าก่อน'));state.busy++;$('loading').hidden=false;return new Promise((resolve,reject)=>{const requestId=uid()+uid(),frame=document.createElement('iframe'),form=document.createElement('form'),input=document.createElement('input');frame.hidden=true;frame.name='tlm_'+requestId.replace(/-/g,'');form.hidden=true;form.method='POST';form.action=apiUrl;form.target=frame.name;input.name='payload';input.value=JSON.stringify({action,...data,token:state.token,requestId,origin:location.origin});form.append(input);document.body.append(frame,form);const cleanup=()=>{clearTimeout(timer);pending.delete(requestId);frame.remove();form.remove();state.busy--;$('loading').hidden=state.busy===0;};const timer=setTimeout(()=>{cleanup();reject(Error('หมดเวลารอ GAS กรุณาตรวจ Deploy และโหลดข้อมูลใหม่ก่อนส่งซ้ำ'));},60000);pending.set(requestId,r=>{cleanup();if(r?.ok){state.connected=true;connection();resolve(r.data);}else{if(r?.error==='SESSION_EXPIRED'){clearPrivate();render('login');reject(Error('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่'));}else reject(Error(r?.error||'คำตอบจาก GAS ไม่ถูกต้อง'));}});form.submit();});}
let dashboardRequest=0;async function refreshDashboard(){const n=++dashboardRequest;try{const result=await api('dashboard',{filters:{...state.filters}});if(n!==dashboardRequest)return false;state.summary=result;if(state.page==='dashboard')render();return true;}catch(e){if(n!==dashboardRequest)return false;state.connected=false;connection();toast(e.message,true);return false;}}

const DIAGNOSES=[
 ['I10','ความดันโลหิตสูงชนิดปฐมภูมิ (Essential hypertension)'],
 ['E10','โรคเบาหวานชนิดที่ 1 (Type 1 diabetes mellitus)'],
 ['E11','โรคเบาหวานชนิดที่ 2 (Type 2 diabetes mellitus)'],

 ['E14','โรคเบาหวานไม่ระบุชนิด (Unspecified diabetes mellitus)']

function diagnosisPicker(fieldName,value=''){const lines=String(value).split('\n'),chosen=DIAGNOSES.filter(([code])=>lines.some(t=>new RegExp('^'+code+'(?:\\s|$)').test(t.trim()))).map(x=>x[0]),other=lines.filter(t=>!DIAGNOSES.some(([code])=>new RegExp('^'+code+'(?:\\s|$)').test(t.trim()))).join('\n');return `<fieldset class="wide dxpicker" data-dx-field="${fieldName}"><legend>Dx · เลือกการวินิจฉัย (เลือกได้มากกว่าหนึ่งโรค)</legend><div class="dxoptions">${DIAGNOSES.map(([code,title])=>`<label><input type="checkbox" data-dx-code="${code}" ${chosen.includes(code)?'checked':''}><span><b>${code}</b> ${esc(title)}</span></label>`).join('')}</div><label>การวินิจฉัยอื่น / รหัสย่อย<textarea data-dx-other>${esc(other)}</textarea></label><input type="hidden" name="${fieldName}" value="${esc(value)}"><p class="smallnote">เลือกชนิดเบาหวานตามการวินิจฉัยที่ยืนยัน ไม่เลือกชนิดจากยาที่ได้รับโดยอัตโนมัติ</p></fieldset>`;}
function syncDiagnosis(box){const value=Array.from(box.querySelectorAll('[data-dx-code]:checked')).map(e=>{const item=DIAGNOSES.find(x=>x[0]===e.dataset.dxCode);return item[0]+' '+item[1];}),other=box.querySelector('[data-dx-other]').value.trim();if(other)value.push(other);box.querySelector('input[type=hidden]').value=value.join('\n');}
function medicationProfile(id=state.selected){return state.medicineProfiles.find(x=>x.patientId===id);}

function bpParts(text){const s=String(text||'').trim();if(!s)return null;const m=s.match(/^(\d{2,3})\s*\/\s*(\d{2,3})$/);return m?[Number(m[1]),Number(m[2])]:false;}
function updateVisitRules(form){const first=form.elements.bp,second=form.elements.bp2,parts=bpParts(first.value),repeat=!!parts&&(parts[0]>140||parts[1]>90);first.setCustomValidity(parts===false?'กรอก BP ในรูปแบบ 120/80':'');second.required=repeat;second.setCustomValidity(second.value&&bpParts(second.value)===false?'กรอก BP ครั้งที่ 2 ในรูปแบบ 120/80':'');const hint=$('bpRepeatHint');if(hint){hint.textContent=repeat?'BP ครั้งที่ 1 ตัวบนเกิน 140 หรือตัวล่างเกิน 90 ต้องกรอก BP ครั้งที่ 2':'BP ครั้งที่ 2 บังคับเมื่อครั้งที่ 1 ตัวบน >140 หรือตัวล่าง >90';hint.className='notice'+(repeat?' error':'');}form.elements.glucose.required=false;const dtx=$('dtxHint');if(dtx)dtx.textContent=/\bI10\b/.test(form.elements.diagnosis.value)?'วินิจฉัย I10: จะกรอกหรือไม่กรอก DTX ก็ได้':'DTX เป็นค่าตรวจที่บันทึกได้เมื่อมีการตรวจจริง';}
function bindClinical(){document.querySelectorAll('.dxpicker').forEach(box=>{syncDiagnosis(box);box.querySelectorAll('input[type=checkbox],textarea').forEach(e=>e.addEventListener('input',()=>{syncDiagnosis(box);if($('visitForm'))updateVisitRules($('visitForm'));}));});const form=$('visitForm');if(form){form.elements.bp.addEventListener('input',()=>updateVisitRules(form));form.elements.bp2.addEventListener('input',()=>updateVisitRules(form));updateVisitRules(form);}if($('copyWordMedicines'))$('copyWordMedicines').onclick=async()=>{const source=state.medicineSources.find(t=>t.key===$('wordMedicineSource').value);if(!source)return;if(!await confirmAction('คัดลอกรายการยาเดิม','ใช้รายการยาจาก '+source.group+' · '+source.name+' แทนรายการในช่องนี้ กรุณาตรวจขนาดและวิธีใช้ก่อนบันทึก'))return;$('medicineProfileForm').elements.medicines.value=source.medicines;};if($('appendDrug'))$('appendDrug').onclick=()=>{const selected=$('drugPicker').value;if(!selected)return;const area=document.querySelector('textarea[name=medicines]'),lines=area.value.split('\n').map(x=>x.trim()).filter(Boolean);if(!lines.includes(selected))lines.push(selected);area.value=lines.join('\n');$('drugPicker').value='';};if($('medicineProfileForm'))$('medicineProfileForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,button=f.querySelector('button[type=submit]');button.disabled=true;try{const profile=medicationProfile();await api('saveMedicines',{patientId:state.selected,medicines:f.elements.medicines.value,version:profile?.version});await loadPrivate();render('detail');toast('บันทึกรายการยาไว้ใช้ครั้งถัดไปแล้ว');}catch(err){toast(err.message,true);button.disabled=false;}};}

const PDFJS_MODULE_BASE64='';
const PDFJS_WORKER_BASE64='';
const LAB_MAX_BYTES=2*1024*1024;
let pdfLibraryPromise;
function pdfLibrary(){if(!pdfLibraryPromise)pdfLibraryPromise=(async()=>{const lib=await import(new URL('pdf.min.mjs',document.baseURI).href),response=await fetch(new URL('pdf.worker.min.mjs.gz',document.baseURI));if(!response.ok)throw Error('โหลดตัวอ่าน PDF ไม่สำเร็จ');const worker=await new Response(response.body.pipeThrough(new DecompressionStream('gzip'))).text();lib.GlobalWorkerOptions.workerSrc='data:text/javascript;base64,'+bytesBase64(encoder.encode(worker));return lib;})().catch(e=>{pdfLibraryPromise=null;throw e;});return pdfLibraryPromise;}
function validatePdfBytes(bytes,filename){if(!/\.pdf$/i.test(filename)||bytes.length<8||bytes.length>LAB_MAX_BYTES||decoder.decode(bytes.slice(0,5))!=='%PDF-')throw Error('เลือกไฟล์ PDF ที่ถูกต้อง ขนาดไม่เกิน 2 MB');}
async function extractLabPdf(bytes){const lib=await pdfLibrary(),task=lib.getDocument({data:bytes.slice(),isEvalSupported:false,useSystemFonts:true,disableFontFace:true,stopAtErrors:true}),lines=[];let doc;try{doc=await task.promise;if(doc.numPages>30)throw Error('PDF เกิน 30 หน้า กรุณากรอกผลจากต้นฉบับ');for(let n=1;n<=doc.numPages;n++){const page=await doc.getPage(n),content=await page.getTextContent();let line='';lines.push('หน้า '+n);for(const item of content.items){if(typeof item.str!=='string')continue;line+=item.str+' ';if(item.hasEOL){lines.push(line.trim());line='';}}if(line.trim())lines.push(line.trim());page.cleanup();}const text=lines.join('\n').trim();if(!lines.some(t=>!/^หน้า \d+$/.test(t)&&t.trim()))return '';return text.slice(0,20000);}finally{await task.destroy();}}
function labVisitOptions(p,selected=''){return `<option value="">เก็บในแฟ้มผู้ป่วย · ไม่ผูกครั้งรับบริการ</option>`+state.visits.filter(v=>v.patientId===p.id).slice().sort((a,b)=>b.date.localeCompare(a.date)).map(v=>`<option value="${esc(v.id)}" ${v.id===selected?'selected':''}>${dateTH(v.date)} · ${esc(v.channel||'รับบริการ')} · ${esc(v.id.slice(-8))}</option>`).join('');}
function labPanel(p){const reports=state.labReports.filter(r=>r.patientId===p.id).slice().sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt)),editing=reports.find(r=>r.id===state.editingLab);return `<h3 class="sectiontitle">ผลเลือด PDF (${reports.length} ไฟล์)</h3><p class="smallnote">อัปโหลด PDF ขนาดไม่เกิน 2 MB อ่านข้อความในเครื่อง แล้วตรวจชื่อผู้ป่วย วันที่ ค่า และหน่วยกับต้นฉบับก่อนยืนยัน รายละเอียดที่บันทึกจะเพิ่มใน Word โดยไม่เปลี่ยนค่าตรวจในทะเบียนอัตโนมัติ</p><form id="labPdfForm" data-edit-id="${esc(editing?.id||'')}"><div class="formgrid">${editing?'':`<label class="wide">ไฟล์ผลเลือด PDF *<input id="labPdfFile" type="file" accept="application/pdf,.pdf" required></label>`}<label>วันที่ตรวจเลือด *<input name="date" type="date" value="${esc(editing?.date||'')}" required></label><label class="wide">ผูกกับครั้งรับบริการ<select name="visitId">${labVisitOptions(p,editing?.visitId||'')}</select></label><label class="wide">รายละเอียดผลเลือดที่จะใส่ใน Word *<textarea name="summary" required maxlength="12000" style="min-height:170px" placeholder="ชื่อรายการตรวจ · ค่า · หน่วย · ช่วงอ้างอิง (ถ้ามี) เช่น HbA1c … %">${esc(editing?.summary||'')}</textarea></label><div class="wide" id="labReadStatus" role="status">${editing?'แก้รายละเอียดได้ โดยไฟล์ PDF ต้นฉบับคงเดิม':'เลือกไฟล์เพื่ออ่านข้อความ หากเป็นภาพสแกนหรืออ่านไม่ได้ ให้เปิดต้นฉบับแล้วกรอกผลเอง'}</div><label class="wide" style="display:flex;gap:10px;align-items:flex-start"><input name="confirmed" type="checkbox" required style="width:18px;margin:0"><span>ฉันตรวจชื่อผู้ป่วย วันที่ ผลตรวจและหน่วยกับ PDF ต้นฉบับแล้ว</span></label></div><div class="actions" style="margin-top:15px"><button type="submit">${editing?'บันทึกการแก้ไขผลเลือด':'อัปโหลดและบันทึกผลเลือด'}</button>${editing?'<button type="button" class="outline" id="cancelLabEdit">ยกเลิก</button>':'<button type="button" class="outline" id="previewLocalLab" disabled>เปิด PDF ที่เลือก</button>'}</div></form>${reports.map(r=>`<article class="notice good"><div class="panelhead"><div><b>${dateTH(r.date)} · ${esc(r.filename)}</b><p class="sub">${r.visitId?'ผูกครั้งรับบริการ '+dateTH(state.visits.find(v=>v.id===r.visitId)?.date):'ข้อมูลในแฟ้มผู้ป่วย'} · บันทึกโดย ${esc(r.uploadedBy)}</p></div><div class="actions"><button class="small outline" data-lab-download="${esc(r.id)}">ดาวน์โหลด PDF</button><button class="small secondary" data-lab-edit="${esc(r.id)}">แก้รายละเอียด</button></div></div><p style="white-space:pre-wrap">${esc(r.summary)}</p></article>`).join('')}`;}
function bytesBase64(bytes){let text='';for(let i=0;i<bytes.length;i+=8192)text+=String.fromCharCode(...bytes.slice(i,i+8192));return btoa(text);}
function bindLabs(){const form=$('labPdfForm');if(!form)return;const epoch=state.sessionEpoch,patientId=state.selected;let selection=0,draft=null;const status=$('labReadStatus'),submit=form.querySelector('button[type=submit]');$('cancelLabEdit')?.addEventListener('click',()=>{state.editingLab='';render('detail');});form.elements.visitId.onchange=()=>{const visit=state.visits.find(v=>v.id===form.elements.visitId.value);if(visit&&!form.elements.date.value)form.elements.date.value=visit.date;};const fileInput=$('labPdfFile');if(fileInput)fileInput.onchange=async()=>{const nonce=++selection;draft=null;submit.disabled=true;$('previewLocalLab').disabled=true;form.elements.summary.value='';form.elements.confirmed.checked=false;try{const file=fileInput.files[0];if(!file){status.textContent='ยังไม่ได้เลือกไฟล์';return;}if(file.size>LAB_MAX_BYTES)throw Error('ไฟล์ใหญ่เกิน 2 MB');const bytes=new Uint8Array(await file.arrayBuffer());validatePdfBytes(bytes,file.name);if(nonce!==selection||epoch!==state.sessionEpoch||!form.isConnected)return;draft={id:uid(),bytes,filename:file.name,extractedText:''};$('previewLocalLab').disabled=false;status.textContent='กำลังอ่านข้อความจาก PDF…';try{const text=await extractLabPdf(bytes);if(nonce!==selection||epoch!==state.sessionEpoch||!form.isConnected)return;draft.extractedText=text;form.elements.summary.value=text.slice(0,12000);status.textContent=text?'อ่านข้อความแล้ว กรุณาจัดรายละเอียดและตรวจทุกค่ากับ PDF ต้นฉบับก่อนบันทึก'+(text.length>12000?' · ข้อความยาวเกินช่อง กรุณาสรุปรายการที่จำเป็น':''):'PDF นี้ไม่มีข้อความที่อ่านได้ กรุณาเปิดต้นฉบับและกรอกผลเอง';}catch(e){if(nonce!==selection||epoch!==state.sessionEpoch||!form.isConnected)return;status.textContent='อ่านข้อความอัตโนมัติไม่ได้ กรุณาเปิด PDF และกรอกผลเอง: '+e.message;}}catch(e){if(nonce===selection){draft=null;status.textContent=e.message;}}finally{if(nonce===selection&&form.isConnected)submit.disabled=false;}};if($('previewLocalLab'))$('previewLocalLab').onclick=()=>{if(draft)download(draft.bytes,draft.filename,'application/pdf');};form.onsubmit=async e=>{e.preventDefault();if(!form.reportValidity())return;submit.disabled=true;try{const editing=state.labReports.find(r=>r.id===form.dataset.editId),details={patientId,date:form.elements.date.value,visitId:form.elements.visitId.value,summary:form.elements.summary.value,confirmed:form.elements.confirmed.checked};if(editing)await api('updateLabReport',{...details,id:editing.id,version:editing.version});else{if(!draft)throw Error('เลือกไฟล์ PDF ที่ถูกต้องก่อน');await api('uploadLabPdf',{...details,id:draft.id,filename:draft.filename,base64:bytesBase64(draft.bytes),extractedText:draft.extractedText});}if(epoch!==state.sessionEpoch)return;await loadPrivate();if(epoch!==state.sessionEpoch)return;state.editingLab='';render('detail');toast('บันทึกผลเลือดแล้ว · ส่งออก Word จะมีรายละเอียดนี้');}catch(err){status.textContent=err.message;toast(err.message,true);if(form.isConnected)submit.disabled=false;}};document.querySelectorAll('[data-lab-edit]').forEach(b=>b.onclick=()=>{state.editingLab=b.dataset.labEdit;render('detail');$('labPdfForm').scrollIntoView({behavior:'smooth',block:'start'});});document.querySelectorAll('[data-lab-download]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const d=await api('labPdf',{id:b.dataset.labDownload,patientId});if(epoch!==state.sessionEpoch)return;download(fromBase64(d.base64),d.filename,'application/pdf');}catch(e){toast(e.message,true);}finally{b.disabled=false;}});}
function labReportsForWord(p,visit){return state.labReports.filter(r=>r.patientId===p.id&&(!visit||!r.visitId||r.visitId===visit.id)).slice().sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt));}
// คัดเฉพาะรายการตรวจที่มีช่องในแม่แบบ โดยคงค่ากับหน่วยตามข้อความที่ผู้ใช้ตรวจทาน.
function labTextWithoutTrailingDate(text){return String(text||'').replace(/\s+(?:\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}|\d{4}-\d{1,2}-\d{1,2})(?:\s+\d{1,2}:\d{2}(?::\d{2})?)?\s*$/,'').replace(/\s+\d{1,2}\s+(?:ม\.?ค\.?|ก\.?พ\.?|มี\.?ค\.?|เม\.?ย\.?|พ\.?ค\.?|มิ\.?ย\.?|ก\.?ค\.?|ส\.?ค\.?|ก\.?ย\.?|ต\.?ค\.?|พ\.?ย\.?|ธ\.?ค\.?)\s*\d{4}\s*$/,'').trim();}
function wordLabSummary(text){const allowed=/^(?:DTX|FBS|FPG|fasting\s+(?:blood\s+)?(?:glucose|sugar)|glucose|HbA1c|hemoglobin\s+A1c|BUN|blood\s+urea\s+nitrogen|Cr(?:eatinine)?|Chol(?:esterol)?|total\s+cholesterol|TG|triglycerides?|HDL(?:[ -]?C)?|LDL(?:[ -]?C)?|e?GFR|urine\s+protein|protein\s+urine|MAU|microalbumin(?:uria)?|urine\s+microalbumin)\b/i,split=/(?=\b(?:DTX|FBS|FPG|HbA1c|BUN|Creatinine|Cholesterol|Triglycerides?|HDL(?:[ -]?C)?|LDL(?:[ -]?C)?|eGFR|GFR|Urine\s+protein|MAU|Microalbumin|Na\+?|K\+?|Cl[-−]?|CO2|Sodium|Potassium|Chloride|AST|ALT|ALP|WBC|RBC|Platelet|Hematocrit)\b)/i;const rows=String(text||'').split(/[\n;；]+/).flatMap(line=>line.split(split)).map(line=>line.trim()).filter(Boolean),out=[];let collecting=false;for(const row of rows){if(allowed.test(row)){out.push(row);collecting=true;}else if(collecting&&/^(?:[-+]?\d|[<>≤≥]|mg\/|mmol\/|mL\/|%|negative\b|positive\b|trace\b|ไม่พบ|พบ)/i.test(row)){out[out.length-1]+=' '+row;}else collecting=false;}return [...new Set(out.map(labTextWithoutTrailingDate))].join('\n');}
function appendLabsToWord(doc,body,sect,p,visit){const reports=labReportsForWord(p,visit);if(!reports.length)return;const paragraph=text=>{const node=doc.createElementNS(WNS,'w:p');setParagraph(node,text);return node;};body.insertBefore(paragraph('รายละเอียดผลเลือดจาก PDF · '+fullName(p)+' · HN '+blank(p.hn)),sect||null);for(const report of reports){body.insertBefore(paragraph('ไฟล์ '+report.filename+'\n'+(report.visitId?'ครั้งรับบริการ '+dateTH(state.visits.find(v=>v.id===report.visitId)?.date):'ผลเลือดในแฟ้มผู้ป่วย')+'\n'+(wordLabSummary(report.summary)||'ไม่พบรายการตรวจที่ตรงกับช่องในแบบฟอร์ม')+'\nตรวจทานและบันทึกโดย '+report.uploadedBy),sect||null);}}

function render(page=state.page){if(!state.token&&['patients','import','appointments','documents','excel','users','detail','patientform','visitform'].includes(page)){state.afterLogin=['detail','patientform','visitform'].includes(page)?'patients':page;page='login';}if(page==='users'&&state.token&&state.role!=='admin'){toast('เฉพาะแอดมินเท่านั้นที่จัดการผู้ใช้ได้',true);page='dashboard';}state.page=page;$('sidebar').classList.remove('open');$('crumb').textContent=NAV.find(n=>n[0]===page)?.[2]||(page==='login'?'เข้าสู่ระบบ':'แฟ้มการดูแล');$('account').textContent=state.token?state.user+' · ออกจากระบบ':'เข้าสู่ระบบ ↗';$('nav').innerHTML=NAV.filter(([id])=>id!=='users'||state.token&&state.role==='admin').map(([id,icon,title])=>`<button data-nav="${id}" class="${id===page||id==='patients'&&['detail','patientform','visitform'].includes(page)?'active':''}"><svg fill="none" stroke="currentColor" stroke-width="1.7"><use href="#${icon}"/></svg>${title}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>b.dataset.nav==='users'?openUsers():render(b.dataset.nav));const views={dashboard,patients,import:importView,appointments,documents,excel:excelView,users:userManagementView,settings,login,detail,patientform,visitform};$('main').innerHTML=views[page]();bind(page);bindClinical();bindAllergy();bindUsers();bindLabs();connection();}
function filterSelect(k,label,values){return `<select data-filter="${k}" aria-label="${label}"><option value="">${label}</option>${values.map(v=>{const value=Array.isArray(v)?v[0]:v,text=Array.isArray(v)?v[1]:v;return `<option value="${esc(value)}" ${state.filters[k]===value?'selected':''}>${esc(text)}</option>`;}).join('')}</select>`;}
function dashboard(){const d=state.summary;return heading('ภาพรวมการดูแล','ข้อมูลจริงจาก Google Sheet · รพ.สต.บ้านหลุบเลา',`<span class="date">${dateTH(today())}</span>`)+`<section class="hero"><div><div class="eyebrow">BAN LUP LAO · TELEMEDICINE</div><h2>ดูแลใกล้ชิด<br><span>แม้อยู่ไกล</span></h2><p>ติดตามสุขภาพอย่างต่อเนื่อง เชื่อมข้อมูลสู่ทุกบ้าน<br>ให้ทีมดูแลเห็นภาพเดียวกัน ในทุกระยะทาง</p><button id="heroImport">นำเข้าทะเบียน Excel &nbsp; ↗</button></div><svg viewBox="0 0 260 185" aria-hidden="true"><circle cx="132" cy="88" r="76" fill="#ffffff09" stroke="#ffffff20"/><path d="M15 100h52l18-34 25 66 22-45 18 13h93" fill="none" stroke="#b5ef56" stroke-width="3" stroke-linecap="round"/><rect x="158" y="24" width="60" height="54" rx="14" fill="#fff"/><path d="M188 37v27m-13-13h26" stroke="#00865b" stroke-width="6" stroke-linecap="round"/><rect x="51" y="126" width="128" height="40" rx="12" fill="#fff"/><circle cx="73" cy="146" r="9" fill="#b5ef56"/><path d="m69 146 3 3 5-6" stroke="#00865b" fill="none" stroke-width="2"/><rect x="91" y="140" width="67" height="4" rx="2" fill="#caddca"/><rect x="91" y="149" width="45" height="4" rx="2" fill="#e1eadd"/></svg></section><div class="filters"><span class="filterlabel">ตัวกรองข้อมูล</span>${filterSelect('group','ทุกพื้นที่',GROUPS)}${filterSelect('diseaseClass','ทุกกลุ่มโรค',[['ht','I10 อย่างเดียว'],['dm','E11–E14 อย่างเดียว'],['both','มีทั้ง I10 และ E11–E14'],['other','อื่น ๆ / ยังไม่ระบุ']])}${filterSelect('ageBand','ทุกช่วงอายุ',[['under60','ต่ำกว่า 60 ปี'],['60+','60 ปีขึ้นไป'],['unknown','ยังไม่มีอายุ']])}${filterSelect('status','ทุกสถานะ',['ใช้งาน','ย้ายออก','เสียชีวิต'])}<button class="outline small" id="clearFilters">ล้างตัวกรอง</button><button class="secondary small" id="refreshDashboard">↻ รีเฟรช</button></div><div class="stats">${[['ผู้ป่วยตามเงื่อนไข','total','♧','จากทั้งหมด '+(d?.allTotal??'—')+' คน'],['I10 อย่างเดียว','hypertensionOnly','♡','ไม่มี E11–E14 ร่วม'],['E11–E14 อย่างเดียว','diabetesOnly','+','ไม่มี I10 ร่วม'],['มีทั้งสองกลุ่มโรค','bothDiseases','♧','I10 ร่วมกับ E11–E14']].map(([title,k,icon,note])=>`<div class="stat"><div class="stathead">${title}<i>${icon}</i></div><div class="statnum">${d?.[k]??'—'} <small>คน</small></div><div class="statfoot">${esc(note)}</div></div>`).join('')}</div>${!d?'<div class="notice">ยังไม่มีข้อมูลจาก Google Sheet · กรุณาตั้งค่า URL ของ GAS แล้วทดสอบการเชื่อมต่อ <button class="small secondary" id="setupLink">ตั้งค่าระบบ ↗</button></div>':''}<div class="grid"><section class="panel"><div class="panelhead"><div><h2>ผู้ป่วยในแต่ละพื้นที่</h2><p class="sub">จำนวนตามตัวกรองปัจจุบัน</p></div><span class="tag">6 พื้นที่</span></div><div class="bars">${GROUPS.map(g=>{const count=d?.groups.find(x=>x.name===g)?.total,max=d?Math.max(1,...d.groups.map(x=>x.total)):1;return `<div class="barcol"><span>${count??'—'}</span><div class="bar" style="height:${count==null?3:Math.max(3,count/max*128)}px"></div></div>`;}).join('')}</div><div class="barlabels">${GROUPS.map(g=>`<span>${g.replace('หมู่','หมู่ ')}</span>`).join('')}</div><p class="smallnote">แสดงเฉพาะยอดรวม · รายชื่อและข้อมูลสุขภาพต้องเข้าสู่ระบบ</p></section><section class="panel"><div class="panelhead"><div><h2>ความต่อเนื่องในการดูแล</h2><p class="sub">ความครบถ้วนและการติดตาม</p></div><span class="tag">CARE OVERVIEW</span></div>${[['อื่น ๆ / ยังไม่ระบุใน 3 กลุ่ม',d?.otherDiseases,'คน'],['ข้อมูลรอตรวจทาน',d?.review,'คน'],['ผู้ป่วยสถานะใช้งาน',d?.active,'คน'],['มีค่าความดันในทะเบียน',d?.recordedBP,'คน'],['มีค่าน้ำตาลในทะเบียน',d?.recordedGlucose,'คน'],['บันทึกการติดตาม',d?.visits,'ครั้ง'],['นัดล่าสุดถึง / เลยกำหนด',d?.due,'คน']].map(([k,n,u])=>`<div class="metricrow"><span>${k}</span><b>${n??'—'} ${u}</b></div>`).join('')}</section></div><p class="smallnote">จัดกลุ่มจากโรคในทะเบียนร่วมกับวินิจฉัยในการติดตามล่าสุด ผู้ป่วยที่มีทั้งสองโรคนับในกลุ่มร่วมเท่านั้น ข้อความเดิม HT/DM ใช้จัดกลุ่มโดยคงข้อมูลเดิมไว้ ส่วน E10 อย่างเดียวไม่รวมในกลุ่ม E11–E14</p><div class="bottomline"><span>รพ.สต.บ้านหลุบเลา · อำเภอภูพาน จังหวัดสกลนคร</span><span>${d?'อัปเดต '+new Date(d.updatedAt).toLocaleTimeString('th-TH',{timeZone:'Asia/Bangkok'}):'รอเชื่อมต่อ GAS'} · TLM206</span></div>`;}
function login(){return `<div class="panel loginbox"><div class="loginicon">♧</div><h1>เข้าสู่พื้นที่ดูแล</h1><p class="sub">ยืนยันตัวตนก่อนเข้าถึงข้อมูลผู้ป่วย<br>และนำเข้าทะเบียน Excel</p><form id="loginForm"><label>Username<input name="username" autocomplete="username" required placeholder="ชื่อผู้ใช้"></label><label>Password<input name="password" type="password" autocomplete="current-password" required placeholder="รหัสผ่าน"></label><button type="submit">เข้าสู่ระบบ ↗</button></form><button class="secondary" id="setupLink">ตั้งค่าการเชื่อมต่อ</button></div>`;}
// จัดกลุ่มเพื่อแสดงผล ไม่เพิ่มหรือแก้รหัสวินิจฉัยในทะเบียน.
function classifyDisease(text){const value=String(text||''),codedHypertension=/\bI10(?:\.\d+)?\b/i.test(value),hasHypertensionCode=/\bI1[0-5](?:\.\d+)?\b/i.test(value),hypertension=codedHypertension||!hasHypertensionCode&&/\bHT\b|ความดันโลหิตสูง/i.test(value),codedDiabetes=/\bE1[1-4](?:\.\d+)?\b/i.test(value),hasDiabetesCode=/\bE1[0-4](?:\.\d+)?\b/i.test(value),legacyDiabetes=!hasDiabetesCode&&/\bDM\b|เบาหวาน/i.test(value),diabetes=codedDiabetes||legacyDiabetes;return hypertension&&diabetes?'both':hypertension?'ht':diabetes?'dm':'other';}

function diseaseClassOf(p){return classifyDisease(p.disease+'\n'+(latest(p.id)?.diagnosis||''));}
function diseaseClassLabel(p){return {ht:'I10 อย่างเดียว',dm:'E11–E14 อย่างเดียว',both:'I10 + E11–E14',other:'อื่น ๆ / ยังไม่ระบุ'}[diseaseClassOf(p)];}
function filtered(){return state.patients.filter(p=>(!state.listGroup||p.group===state.listGroup)&&(!state.listDiseaseClass||diseaseClassOf(p)===state.listDiseaseClass)&&(!state.search||[fullName(p),p.hn,p.cid,p.phone].join(' ').toLowerCase().includes(state.search.toLowerCase())));}
function toolbar(){return `<div class="toolbar"><input id="search" aria-label="ค้นหาผู้ป่วย" value="${esc(state.search)}" placeholder="ค้นหาชื่อ HN เลขบัตร หรือโทรศัพท์"><select id="listGroup" aria-label="พื้นที่"><option value="">ทุกพื้นที่</option>${GROUPS.map(g=>`<option ${g===state.listGroup?'selected':''}>${g}</option>`).join('')}</select><select id="listDiseaseClass" aria-label="กลุ่มโรค"><option value="">ทุกกลุ่มโรค</option>${[['ht','I10 อย่างเดียว'],['dm','E11–E14 อย่างเดียว'],['both','มีทั้งสองกลุ่มโรค'],['other','อื่น ๆ / ยังไม่ระบุ']].map(([value,label])=>`<option value="${value}" ${state.listDiseaseClass===value?'selected':''}>${label}</option>`).join('')}</select><button class="outline" id="reload">↻ โหลดใหม่</button></div>`;}
function patients(){const all=filtered(),start=(state.pageNo-1)*20;return heading('ทะเบียนผู้ป่วย','ข้อมูลล่าสุดที่บันทึกใน Google Sheet',`<div class="actions"><button class="outline" id="exportExcel">ส่งออก Excel ↓</button><button id="gotoImport">+ นำเข้า / อัปเดต Excel</button></div>`)+toolbar()+`<p class="smallnote">พบ ${all.length} คน · ทะเบียนทั้งหมด ${state.patients.length} คน · ส่งออก Excel ตามตัวกรองปัจจุบัน โดยใช้ค่าจากทะเบียนหลัก</p><div class="tablewrap"><table><thead><tr><th>ผู้ป่วย / HN</th><th>พื้นที่</th><th>โทรศัพท์</th><th>สถานะ</th><th></th></tr></thead><tbody>${all.slice(start,start+20).map(p=>`<tr><td><b>${esc(fullName(p))}</b><div class="cellsub">HN ${esc(p.hn||'—')} · ${esc(p.age||'—')} ปี</div><div class="cellsub"><span class="badge">${diseaseClassLabel(p)}</span></div></td><td>${esc(p.group)}<div class="cellsub">บ้าน ${esc(p.house||'—')}</div></td><td>${esc(p.phone||'—')}</td><td><span class="badge ${p.status!=='ใช้งาน'?'gray':''}">${esc(p.status)}</span>${p.notes?.includes('ตรวจทาน')?'<div class="cellsub" style="color:#a06b2a">มีข้อมูลรอตรวจทาน</div>':''}</td><td><button class="small secondary" data-open="${esc(p.id)}">เปิดแฟ้ม ↗</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">ไม่พบข้อมูลตามเงื่อนไข</td></tr>'}</tbody></table></div><div class="pagination"><span>หน้า ${state.pageNo} / ${Math.max(1,Math.ceil(all.length/20))}</span><div class="actions"><button class="small secondary" id="prev" ${state.pageNo===1?'disabled':''}>← ก่อนหน้า</button><button class="small secondary" id="next" ${start+20>=all.length?'disabled':''}>ถัดไป →</button></div></div>`;}
function importView(){const plan=state.importPlan,working=['reading','checking','saving'].includes(state.importStage);return heading('นำเข้าทะเบียน Excel','ตรวจทานก่อนบันทึก · เพิ่มหรืออัปเดตตามพื้นที่และ HN / เลขบัตร',`<span class="tag">${esc(state.user)} · เข้าสู่ระบบแล้ว</span>`)+`<section class="panel"><h2>ทะเบียนผู้ป่วยทั้ง 6 พื้นที่</h2><p class="sub">รองรับ .xlsx ตามหัวตารางไฟล์ทะเบียนที่แนบ · สูงสุด 10 MB / 2,000 แถว</p><div class="drop"><div class="uploadicon">⇧</div><h3>เลือกไฟล์ Excel จากเครื่อง</h3><p class="sub">อ่านและตรวจข้อมูลก่อนส่งไป Google Sheet</p><input id="excelFile" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" ${working?'disabled':''}></div>${state.importStage!=='idle'?`<div class="progress"><span style="width:${state.importProgress}%"></span></div><div class="notice ${state.importStage==='error'?'error':state.importStage==='success'?'good':''}" role="status">${esc(state.importMessage)}</div>`:''}${plan?`<div class="importstats">${[['เพิ่มใหม่',plan.added],['อัปเดต',plan.updated],['ไม่เปลี่ยนแปลง',plan.unchanged],['ข้อผิดพลาด',plan.errors.length]].map(([t,n])=>`<div class="importstat"><strong>${n}</strong><span>${t}</span></div>`).join('')}</div>${plan.errors.length?`<div class="notice error"><b>แก้ข้อผิดพลาดก่อนนำเข้า</b><div class="issuebox">${esc(plan.errors.join('\n'))}</div></div>`:''}${plan.warnings.length?`<div class="notice"><b>ข้อมูลที่ต้องตรวจทาน (${plan.warnings.length} จุด)</b><div class="issuebox">${esc(plan.warnings.join('\n'))}</div><p>คงค่าต้นทางไว้ ไม่เดาแก้ตัวเลขผิดช่อง สามารถแก้ในแฟ้มผู้ป่วยหลังนำเข้า</p></div>`:''}<div class="actions"><button id="commitImport" ${plan.errors.length||working||state.importStage==='success'?'disabled':''}>ยืนยันนำเข้า ${plan.rows} แถว</button><button class="outline" id="recheckImport" ${working?'disabled':''}>ตรวจทานอีกครั้ง</button><button class="secondary" id="importDashboard">เปิด Dashboard ↗</button></div><p class="smallnote">${esc(state.importFile)} · ไม่มีการลบผู้ป่วยที่ไม่ได้อยู่ในไฟล์ · การติดตามและข้อมูลแพ้ยาเดิมคงอยู่</p><div class="tablewrap"><table><thead><tr><th>พื้นที่</th><th>ชื่อผู้ป่วย</th><th>HN</th><th>อายุ</th><th>BP</th><th>น้ำตาล</th></tr></thead><tbody>${state.importRows.slice(0,15).map(p=>`<tr><td>${esc(p.group)}</td><td>${esc(fullName(p))}</td><td>${esc(p.hn)}</td><td>${esc(p.age||'—')}</td><td>${esc(p.bp||'—')}</td><td>${esc(p.glucose||'—')}</td></tr>`).join('')}</tbody></table></div><p class="smallnote">ตัวอย่าง 15 แถวแรกจากทั้งหมด ${state.importRows.length} แถว</p>`:''}<p class="smallnote">ข้อมูล Dashboard จะเปลี่ยนหลัง GAS บันทึกสำเร็จเท่านั้น หากนำเข้าผิดพลาดจะไม่ใช้ข้อมูล Excel ในเครื่องแทนยอดจริง</p></section>`;}
function latest(id){return state.visits.slice().reverse().filter(v=>v.patientId===id).sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt))[0];}
function appointments(){const list=state.patients.filter(p=>p.status==='ใช้งาน').map(p=>({p,v:latest(p.id)})).filter(x=>x.v?.nextDate).sort((a,b)=>a.v.nextDate.localeCompare(b.v.nextDate));return heading('ติดตามและนัดหมาย','วันนัดจากบันทึกการดูแลล่าสุดของผู้ป่วยสถานะใช้งาน',`<button class="outline" id="reload">↻ โหลดใหม่</button>`)+`<div class="tablewrap"><table><thead><tr><th>วันนัด</th><th>ผู้ป่วย</th><th>พื้นที่ / ติดต่อ</th><th>แผนดูแล</th><th>สถานะ</th><th></th></tr></thead><tbody>${list.map(({p,v})=>`<tr><td>${dateTH(v.nextDate)}</td><td><b>${esc(fullName(p))}</b><div class="cellsub">HN ${esc(p.hn)}</div></td><td>${esc(p.group)}<div class="cellsub">${esc(p.phone||'—')}</div></td><td>${esc(v.plan||'—')}</td><td><span class="badge ${v.nextDate<=today()?'warn':''}">${v.nextDate<today()?'เลยกำหนด':v.nextDate===today()?'นัดวันนี้':'รอถึงนัด'}</span></td><td><button class="small secondary" data-open="${esc(p.id)}">เปิดแฟ้ม</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">ยังไม่มีวันนัด · เพิ่มจากบันทึกติดตามในแฟ้มผู้ป่วย</td></tr>'}</tbody></table></div>`;}
function excelView(){const list=filtered();return heading('ส่งออก Excel','ดาวน์โหลดทะเบียนตามแบบไฟล์ต้นฉบับ ครบทั้ง 6 ชีต')+'<section class="panel"><h2>เลือกข้อมูลที่ต้องการส่งออก</h2><p class="sub">ข้อมูลทะเบียนล่าสุดจาก Google Sheet · HN เลขบัตรและโทรศัพท์รักษาเลขศูนย์นำหน้า</p>'+toolbar()+`<div class="notice good">พร้อมส่งออก ${list.length} คนตามตัวกรองปัจจุบัน · หากต้องการทุกคนให้ล้างคำค้นและเลือกทุกพื้นที่</div><button id="exportExcel" style="font-size:16px;padding:17px 28px">↓ ดาวน์โหลดทะเบียน Excel (.xlsx)</button><p class="smallnote">คงชื่อชีต หัวตาราง การรวมเซลล์ และรูปแบบทะเบียนเดิม ไฟล์จะอยู่ในโฟลเดอร์ดาวน์โหลดของเบราว์เซอร์</p></section>`;}
function documents(){const all=filtered();return heading('เอกสารและการพิมพ์','ใช้ตาราง รูปแบบ และโครงสร้างจาก Word ที่แนบ',`<div class="actions"><button class="outline" id="exportExcel">ส่งออก Excel ↓</button><button id="bulkWord">ดาวน์โหลด Word เป็น ZIP</button></div>`)+`<div class="notice good">ไฟล์ .docx จริง · จับคู่แบบเดิมด้วยพื้นที่ HN และชื่อเต็ม · ถ้าจับคู่ไม่ได้แน่นอนจะใช้แบบกลางของพื้นที่นั้น โดยไม่ใช้ข้อมูลของผู้ป่วยอื่น</div>`+toolbar()+`<div class="tablewrap"><table><thead><tr><th>ผู้ป่วย / HN</th><th>พื้นที่</th><th>ติดตามล่าสุด</th><th>ส่งออก</th></tr></thead><tbody>${all.map(p=>`<tr><td><b>${esc(fullName(p))}</b><div class="cellsub">HN ${esc(p.hn||'—')}</div></td><td>${esc(p.group)}</td><td>${dateTH(latest(p.id)?.date)}</td><td><div class="actions"><button class="small secondary" data-word="${esc(p.id)}">Word ↓</button><button class="small outline" data-print="${esc(p.id)}">พิมพ์ A4</button></div></td></tr>`).join('')||'<tr><td colspan="4" class="empty">ไม่มีข้อมูลสำหรับส่งออก</td></tr>'}</tbody></table></div><p class="smallnote">Word ใช้แม่แบบเดิมที่ฝั่ง GAS พร้อมข้อมูลทะเบียนและบันทึกติดตามล่าสุดสองครั้ง รายการยาใน Word ใช้แฟ้มยาประจำที่บันทึกไว้หรือรายการยาในบันทึกติดตาม เปิดข้อความ Word ต้นฉบับในแฟ้มเพื่ออ้างอิงก่อนบันทึกคำสั่งรักษาที่ตรวจสอบแล้ว</p>`;}
function current(){return state.patients.find(p=>p.id===state.selected);}
function addPatientControls(){const p=current();if(state.page==='patients'&&!$('addPatient')){const a=document.querySelector('.heading .actions');if(a){const b=document.createElement('button');b.id='addPatient';b.textContent='+ เพิ่มผู้ป่วยรายใหม่';a.prepend(b);b.onclick=()=>{const id=uid();state.selected=id;state.patients.push({id,isNew:true,firstName:'',lastName:'',group:GROUPS[0],status:'ใช้งาน',consent:'ยังไม่บันทึก'});render('patientform');};}}if(state.page==='patientform'&&p&&!$('mapLink')){const w=document.createElement('label');w.className='wide';w.innerHTML='ลิงก์ Google Maps บ้านผู้ป่วย<input id="mapLink" name="mapLink" type="url" placeholder="วางลิงก์ Google Maps ที่ปักหมุดแล้ว" value="'+esc(p.mapLink||'')+'">';$('patientForm')?.querySelector('.formgrid')?.append(w);}if(state.page==='detail'&&p&&!$('mapPinButton')){const a=document.querySelector('.panel .actions');if(a){const b=document.createElement('button');b.id='mapPinButton';b.className='outline';b.textContent='ปักหมุดผู้ป่วยใน Google Maps ↗';b.onclick=()=>window.open(p.mapLink||('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([p.house,p.village,p.subdistrict,p.group,'สกลนคร'].filter(Boolean).join(' '))),'_blank');a.append(b);}}}
new MutationObserver(addPatientControls).observe($('main'),{childList:true});
function detail(){const p=current();if(!p)return '<div class="empty">ไม่พบผู้ป่วย</div>';const v=state.visits.filter(x=>x.patientId===p.id).sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt));return heading(esc(fullName(p)),'HN '+esc(p.hn||'—')+' · '+esc(p.group),`<button class="outline" id="backPatients">← ทะเบียน</button>`)+`<section class="panel"><div class="panelhead"><h2>แฟ้มการดูแลรายบุคคล</h2><div class="actions"><button class="secondary" id="editPatient">แก้ไขทะเบียน</button><button id="addVisit">+ บันทึกติดตาม</button></div></div><div class="detailmeta">${[['อายุ',p.age?p.age+' ปี':'ยังไม่ระบุ'],['โทรศัพท์',p.phone],['โรคประจำตัว',p.disease],['แพ้ยา',p.allergy||'ยังไม่บันทึก'],['DTX จากทะเบียน Excel',p.glucose? p.glucose+' mg/dL · ไม่ยืนยันวันที่ตรวจ':'ยังไม่ระบุ'],['ที่อยู่',p.house+' หมู่ '+p.village+' ต.'+p.subdistrict],['ผู้ดูแล',p.caregiver],['ความยินยอม',p.consent],['สถานะ',p.status]].map(([k,val])=>`<div><small>${k}</small>${esc(val||'—')}</div>`).join('')}</div>${p.notes?`<div class="notice">${esc(p.notes).replace(/\n/g,'<br>')}</div>`:''}<div class="actions"><button class="outline" data-word="${esc(p.id)}">ดาวน์โหลด Word ↓</button><button class="outline" data-print="${esc(p.id)}">พิมพ์ A4</button><button class="secondary" id="reference">ข้อความ Word ต้นฉบับ</button></div><div id="referenceArea"></div>${medicationPanel(p)}${labPanel(p)}<h3 class="sectiontitle">ประวัติการติดตาม (${v.length} ครั้ง)</h3><div class="tablewrap"><table><thead><tr><th>วันที่ / ช่องทาง</th><th>BP / DTX</th><th>CC / แผน</th><th>นัด / ผู้ตรวจ</th><th></th></tr></thead><tbody>${v.map(x=>`<tr><td>${dateTH(x.date)}<div class="cellsub">${esc(x.channel)}</div></td><td>${esc(x.bp||'—')}<br>${esc(x.glucose||'—')} mg/dL</td><td>${esc(x.cc||'—')}<div class="cellsub">${esc(x.plan||'—')}</div></td><td>${dateTH(x.nextDate)}<div class="cellsub">${esc(x.clinician||'—')}</div></td><td><button class="small secondary" data-visitword="${esc(x.id)}">Word</button><button class="small outline" data-visitprint="${esc(x.id)}">พิมพ์</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">ยังไม่มีบันทึกติดตามในระบบ<br>ค่าจาก Excel เป็นข้อมูลทะเบียน ไม่ใช่ผลตรวจครั้งใหม่</td></tr>'}</tbody></table></div></section>`;}
function field(k,label,value='',type='text'){return `<label>${label}<input name="${k}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0" step="any"':''} ${['firstName','lastName','date'].includes(k)?'required':''}></label>`;}
function select(k,label,values,value){return `<label>${label}<select name="${k}">${values.map(v=>`<option ${v===value?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`;}
function area(k,label,value=''){return `<label class="wide">${label}<textarea name="${k}">${esc(value)}</textarea></label>`;}
function patientform(){const p=current();if(!p)return '<div class="empty">ไม่พบผู้ป่วย</div>';return heading('แก้ไขทะเบียนผู้ป่วย',esc(fullName(p)),`<button class="outline" id="cancelForm">ยกเลิก</button>`)+`<form class="panel" id="patientForm"><div class="formgrid">${field('prefix','คำนำหน้า',p.prefix)}${field('firstName','ชื่อ *',p.firstName)}${field('lastName','นามสกุล *',p.lastName)}${field('hn','HN',p.hn)}${field('cid','เลขบัตรประชาชน',p.cid)}${field('age','อายุ (ปี)',p.age)}${select('group','พื้นที่',GROUPS,p.group)}${field('house','บ้านเลขที่',p.house)}${field('village','หมู่',p.village)}${field('subdistrict','ตำบล',p.subdistrict)}${field('phone','โทรศัพท์',p.phone,'tel')}${select('status','สถานะ',['ใช้งาน','ย้ายออก','เสียชีวิต'],p.status)}${diagnosisPicker('disease',p.disease)}${allergyPicker(p.allergy)}${field('caregiver','ผู้ดูแล / ติดต่อ',p.caregiver)}${select('consent','ยินยอมดูแลทางไกล',['ยังไม่บันทึก','ยินยอม','ไม่ยินยอม'],p.consent)}</div><h3 class="sectiontitle">ค่าจากทะเบียนเดิม</h3><div class="formgrid">${[['weight','น้ำหนัก (kg)'],['height','ส่วนสูง (cm)'],['waist','รอบเอว (cm)'],['bp','BP ครั้งที่ 1'],['bp2','BP ครั้งที่ 2'],['pulse','ชีพจร (/min)'],['glucose','DTX จากทะเบียน Excel (mg/dL)'],['habits','บุหรี่ / สุรา']].map(([k,t])=>field(k,t,p[k])).join('')}${area('notes','หมายเหตุ / จุดที่ต้องตรวจทาน',p.notes)}</div><p class="smallnote">บันทึกใน TLM_Patients ของ Google Sheet · ไม่เขียนกลับ Excel ในเครื่องโดยอัตโนมัติ</p><button type="submit">บันทึกข้อมูล</button></form>`;}
function visitform(){const p=current();if(!p)return '<div class="empty">ไม่พบผู้ป่วย</div>';return heading('บันทึกการติดตาม',esc(fullName(p)),`<button class="outline" id="cancelForm">ยกเลิก</button>`)+`<form class="panel" id="visitForm"><div class="formgrid">${field('date','วันที่ตรวจ *',today(),'date')}${select('channel','ช่องทาง',['โทรศัพท์','วิดีโอคอล','เยี่ยมบ้าน','ที่ รพ.สต.'],'โทรศัพท์')}${select('status','การมาตรวจ',['ตามนัด','ก่อนนัด','หลังนัด','ไม่มีนัด'],'ตามนัด')}</div><h3 class="sectiontitle">สัญญาณชีพและผลตรวจ</h3><div class="formgrid">${[['weight','น้ำหนัก (kg)'],['height','ส่วนสูง (cm)'],['waist','รอบเอว (cm)'],['temp','T (°C)'],['pulse','P (/min)'],['resp','R (/min)'],['spo2','SpO₂ (%)'],['glucose','DTX (mg/dL)'],['hba1c','HbA1c (%)']].map(([k,t])=>field(k,t,'','number')).join('')}${field('bp','BP ครั้งที่ 1 (mmHg)')}${field('bp2','BP ครั้งที่ 2 (mmHg)')}<div class="wide"><p id="bpRepeatHint" class="notice"></p><p id="dtxHint" class="smallnote"></p></div>${area('labs','Lab: Urine protein / MAU / BUN / Cr / Chol / TG / HDL / LDL / GFR')}</div><h3 class="sectiontitle">อาการ ประวัติ และแผนการดูแล</h3><div class="formgrid">${area('cc','CC · อาการสำคัญ')}${area('pi','PI · ประวัติอาการ')}${area('pe','PE · ผลตรวจ / ข้อจำกัดการตรวจทางไกล')}${diagnosisPicker('diagnosis',latest(p.id)?.diagnosis||p.disease)}${medicationPicker()}${area('medicines','Rx · ยา ขนาด วิธีใช้ จำนวน',medicationProfile(p.id)?.medicines||'')}${field('adherence','การใช้ยา / ปัญหา')}${field('surgery','ประวัติผ่าตัด')}${field('habits','บุหรี่ / สุรา')}${field('cvd','CVD Risk')}${field('diet','คุมอาหาร')}${field('exercise','ออกกำลังกาย')}${field('foot','ตรวจเท้า')}${field('dental','ตรวจฟัน')}${field('other','การตรวจอื่น')}${area('plan','แผนดูแล / คำแนะนำ / ส่งต่อ')}${field('nextDate','วันนัดถัดไป','','date')}${field('clinician','ชื่อผู้ตรวจ')}${field('recorder','ผู้ซักประวัติ / ผู้บันทึก',state.user)}</div><p class="smallnote">ช่องว่างหมายถึงยังไม่มีข้อมูลยืนยัน ระบบไม่เติมผลตรวจเก่ามาเป็นผลตรวจใหม่ รายการ Rx ใช้ยาประจำที่เก็บไว้และแก้ไขได้ก่อนบันทึก</p><button type="submit">บันทึกการติดตาม</button></form>`;}
function userManagementView(){const editing=state.userRows.find(u=>u.username===state.editingUser),self=editing?.username===state.user;return heading('จัดการผู้ใช้','เพิ่มบัญชีให้เจ้าหน้าที่แต่ละคน · บันทึกประวัติการทำรายการตามชื่อผู้ใช้',`<button class="outline" id="reloadUsers">↻ โหลดรายชื่อใหม่</button>`)+`<div class="grid"><section class="panel"><h2>เพิ่มผู้ใช้ใหม่</h2><form id="createUserForm"><div class="formgrid" style="grid-template-columns:1fr 1fr;margin-top:20px"><label class="wide">ชื่อผู้ใช้ *<input name="username" required minlength="3" maxlength="40" autocomplete="off" placeholder="เช่น nurse01"></label><label class="wide">ชื่อที่แสดง *<input name="displayName" required maxlength="120" placeholder="ชื่อเจ้าหน้าที่"></label><label>รหัสผ่าน *<input name="password" type="password" required minlength="8" maxlength="128" autocomplete="new-password"></label><label>ยืนยันรหัสผ่าน *<input name="confirmPassword" type="password" required minlength="8" maxlength="128" autocomplete="new-password"></label><label class="wide">สิทธิ์<select name="role"><option value="staff">ผู้ใช้งานทั่วไป</option><option value="admin">แอดมิน</option></select></label></div><p class="smallnote">ชื่อผู้ใช้ 3–40 ตัว ใช้อักษรอังกฤษ ตัวเลข จุด ขีดกลาง หรือขีดล่าง รหัสผ่านอย่างน้อย 8 ตัว แอดมินสามารถจัดการบัญชีคนอื่นได้</p><button type="submit">+ เพิ่มผู้ใช้</button></form></section><section class="panel">${editing?`<h2>แก้ไขบัญชี ${esc(editing.username)}</h2><form id="editUserForm"><div class="formgrid" style="grid-template-columns:1fr;margin-top:20px"><label>ชื่อที่แสดง<input name="displayName" required maxlength="120" value="${esc(editing.displayName)}"></label><label>สิทธิ์<select name="role" ${self?'disabled':''}><option value="staff" ${editing.role==='staff'?'selected':''}>ผู้ใช้งานทั่วไป</option><option value="admin" ${editing.role==='admin'?'selected':''}>แอดมิน</option></select></label><label>สถานะ<select name="active" ${self?'disabled':''}><option value="true" ${editing.active?'selected':''}>เปิดใช้งาน</option><option value="false" ${!editing.active?'selected':''}>ปิดใช้งาน</option></select></label>${!self?'<label>ตั้งรหัสผ่านใหม่ (เว้นว่างเพื่อคงรหัสเดิม)<input name="newPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password"></label>':'<p class="smallnote">เปลี่ยนรหัสผ่านของตนเองในตั้งค่าระบบ บัญชีที่ใช้อยู่จะคงสิทธิ์แอดมินและสถานะเปิดใช้งาน</p>'}</div><div class="actions" style="margin-top:20px"><button type="submit">บันทึกบัญชี</button><button class="secondary" type="button" id="cancelEditUser">ยกเลิก</button></div></form>`:'<h2>สิทธิ์และการใช้งาน</h2><p class="smallnote">ผู้ใช้งานทั่วไปเข้าถึงทะเบียน บันทึกการดูแล และส่งออกเอกสารตามระบบเดิม แอดมินมีสิทธิ์จัดการผู้ใช้เพิ่มเติม</p><p class="smallnote">เลือกรายชื่อด้านล่างเพื่อแก้ไขสิทธิ์ เปิด/ปิดใช้งาน หรือตั้งรหัสผ่านใหม่</p><p class="smallnote">ระบบเก็บรหัสผ่านเป็น hash ไม่มีการแสดงรหัสผ่านเดิม บัญชีที่ถูกปิดจะล็อกอินหรือส่งคำขอข้อมูลใหม่ไม่ได้</p>'}</section></div><section class="panel" style="margin-top:22px"><div class="panelhead"><h2>บัญชีผู้ใช้ (${state.userRows.length})</h2><span class="tag">เฉพาะแอดมิน</span></div><div class="tablewrap"><table><thead><tr><th>ชื่อผู้ใช้</th><th>ชื่อที่แสดง</th><th>สิทธิ์</th><th>สถานะ</th><th></th></tr></thead><tbody>${state.userRows.map(u=>`<tr><td><b>${esc(u.username)}</b>${u.username===state.user?'<div class="cellsub">บัญชีที่ใช้อยู่</div>':''}</td><td>${esc(u.displayName)}</td><td>${u.role==='admin'?'แอดมิน':'ผู้ใช้งานทั่วไป'}</td><td><span class="badge ${u.active?'':'gray'}">${u.active?'เปิดใช้งาน':'ปิดใช้งาน'}</span></td><td><button class="small secondary" data-edit-user="${esc(u.username)}">แก้ไขบัญชี</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">กดโหลดรายชื่อใหม่เพื่อแสดงบัญชีผู้ใช้</td></tr>'}</tbody></table></div></section>`;}
async function loadUsers(){const epoch=state.sessionEpoch,rows=await api('users');if(epoch!==state.sessionEpoch)return false;state.userRows=rows;return true;}
async function openUsers(){if(!state.token){state.afterLogin='users';return render('login');}if(state.role!=='admin'){toast('เฉพาะแอดมินเท่านั้นที่จัดการผู้ใช้ได้',true);return render('dashboard');}try{if(await loadUsers())render('users');}catch(e){toast(e.message,true);}}

function settings(){return heading('ตั้งค่าระบบ','เชื่อม Google Sheet และจัดการบัญชี')+`<section class="panel settings"><h2>Google Apps Script Web App</h2><form id="urlForm"><label>URL ที่ลงท้าย /exec<input type="url" name="url" value="${esc(apiUrl)}" placeholder="https://script.google.com/macros/s/…/exec" required></label><div class="actions"><button type="submit">บันทึกและทดสอบ</button><button class="outline" type="button" id="refreshDashboard">ทดสอบการเชื่อมต่อ</button></div></form><h3 class="sectiontitle">ติดตั้งครั้งแรก</h3><ol><li>สร้าง Google Sheet ใหม่ หรือแปลง Excel เป็น Google Sheet</li><li>เปิด ส่วนขยาย → Apps Script วาง Code.gs ทั้งไฟล์</li><li>เลือก setup → Run → อนุญาตการเข้าถึงชีต ไม่ต้องกรอก Sheet ID</li><li>Deploy → New deployment → Web app → Execute as: Me</li><li>กำหนดการเข้าถึงตามนโยบายหน่วยงาน แล้วคัดลอก URL /exec</li><li>ใส่ URL ด้านบน เข้าสู่ระบบ admin / 1234 แล้วนำเข้า Excel</li></ol><p class="smallnote">สำหรับ standalone ที่ใช้บัญชีของระบบ ให้เลือก Anyone หากนโยบายองค์กรอนุญาต การเข้าถึงข้อมูลรายบุคคลและนำเข้ายังตรวจ session ที่ฝั่ง GAS หากแก้โค้ดให้ Deploy เวอร์ชันใหม่ที่ URL เดิม</p><p class="smallnote">Dashboard ใช้ข้อมูลจาก GAS เท่านั้น URL เป็นข้อมูลเดียวที่บันทึกในเครื่อง รายชื่อและเซสชันอยู่ในหน่วยความจำ รีโหลดหน้าจะต้องล็อกอินใหม่</p>${state.token?`<h3 class="sectiontitle">เปลี่ยนรหัสผ่าน · ${esc(state.user)}</h3><form id="passwordForm"><div class="formgrid">${field('oldPassword','รหัสผ่านปัจจุบัน','','password')}${field('newPassword','รหัสผ่านใหม่ อย่างน้อย 8 ตัว','','password')}</div><button type="submit" style="margin-top:18px">เปลี่ยนรหัสผ่านและออกจากระบบ</button></form>`:''}<h3 class="sectiontitle">การส่งออก Word</h3><p class="smallnote">Code.gs รวมแม่แบบ Word จากโฟลเดอร์ที่แนบไว้ฝั่งเซิร์ฟเวอร์ จึงมีขนาดใหญ่กว่าสคริปต์ทั่วไป ให้คัดลอกไฟล์ครบทั้งส่วนโค้ดและ WORD_BANK เปิด Word แล้วตรวจ Print Preview เพื่อยืนยันการจัดหน้าและฟอนต์ก่อนพิมพ์จริง</p></section>`;}

function printRows(v){const b=k=>blank(v?.[k]);return [['วันที่ / ช่องทาง',(v?.date?dateTH(v.date):'ยังไม่มีวันที่ตรวจ')+' · '+b('channel')],['สัญญาณชีพ','น้ำหนัก '+b('weight')+' kg · ส่วนสูง '+b('height')+' cm · รอบเอว '+b('waist')+' cm\nT '+b('temp')+' · P '+b('pulse')+' · R '+b('resp')+' · SpO₂ '+b('spo2')+' %\nBP '+b('bp')+' · BP ซ้ำ '+b('bp2')],['Lab','DTX '+b('glucose')+' mg/dL · HbA1c '+b('hba1c')+' %\n'+b('labs')],['CC / PI','CC '+b('cc')+'\nPI '+b('pi')],['PE',b('pe')],['Dx / Rx','Dx '+b('diagnosis')+'\nRx '+b('medicines')],['การดูแล','การใช้ยา '+b('adherence')+' · อาหาร '+b('diet')+' · ออกกำลังกาย '+b('exercise')+'\nตรวจเท้า '+b('foot')+' · ตรวจฟัน '+b('dental')],['แผน / นัด',b('plan')+'\nวันนัด '+(v?.nextDate?dateTH(v.nextDate):blank(''))]];}
function parseAllergy(value){const text=String(value||'').trim();if(/^(ปฏิเสธ|ปฎิเสธ|ไม่มี|ไม่มีประวัติแพ้ยา|ไม่แพ้ยา)$/.test(text))return {status:'ปฏิเสธ',detail:''};if(!text||text==='ยังไม่บันทึก')return {status:'',detail:''};return {status:'มี',detail:text.replace(/^มี\s*[:：]?\s*/,'')};}
function allergyPicker(value){const a=parseAllergy(value);return `<div class="wide allergy-fields"><label>ประวัติแพ้ยา<select name="allergyStatus" id="allergyStatus"><option value="" ${!a.status?'selected':''}>ยังไม่บันทึก</option><option ${a.status==='ปฏิเสธ'?'selected':''}>ปฏิเสธ</option><option ${a.status==='มี'?'selected':''}>มี</option></select></label><label id="allergyDetailLabel" ${a.status!=='มี'?'hidden':''}>มีประวัติแพ้ยา · ระบุชื่อยา / อาการแพ้ *<input name="allergyDetail" id="allergyDetail" value="${esc(a.detail)}"></label><input type="hidden" name="allergy" value="${esc(value||'')}"></div>`;}
function syncAllergy(form){const status=form.elements.allergyStatus.value,detail=form.elements.allergyDetail;detail.required=status==='มี';detail.disabled=status!=='มี';$('allergyDetailLabel').hidden=status!=='มี';form.elements.allergy.value=status==='มี'?'มี: '+detail.value.trim():status==='ปฏิเสธ'?'ปฏิเสธ':'';}
function bindAllergy(){const form=$('patientForm');if(!form?.elements.allergyStatus)return;syncAllergy(form);form.elements.allergyStatus.addEventListener('change',()=>syncAllergy(form));form.elements.allergyDetail.addEventListener('input',()=>syncAllergy(form));}
function printCheck(checked){return `<span class="clinical-check" aria-label="${checked?'เลือก':'ไม่เลือก'}">${checked?'✓':''}</span>`;}
function paperValue(value,dots=24){return value==null||value===''?'<span class="paper-dots">'+'.'.repeat(dots)+'</span>':esc(value).replace(/\n/g,'<br>');}
function clinicalHeader(p){const a=parseAllergy(p.allergy);return `<header class="clinical-header"><h1>ใบตรวจคลินิกเบาหวานและความดันโลหิตสูงโรงพยาบาลส่งเสริมสุขภาพตำบลบ้านหลุบเลา</h1><p class="clinical-demographics">ชื่อ-สกุล <span>${paperValue(fullName(p))}</span> อายุ ${paperValue(p.age)} ปี &nbsp; ที่อยู่ ${paperValue(p.house)} หมู่ ${paperValue(p.village)} ตำบล ${paperValue(p.subdistrict)} อำเภอภูพาน จังหวัดสกลนคร</p><p class="clinical-demographics">HN <span class="hn-space">${paperValue(p.hn)}</span> ประวัติแพ้ยา &nbsp; ${printCheck(a.status==='ปฏิเสธ')} ปฏิเสธ &nbsp; ${printCheck(a.status==='มี')} มี (ระบุ) ${paperValue(a.detail)}${!a.status?' <small>(ยังไม่บันทึก)</small>':''}</p></header>`;}
function clinicalCase(p){const text=String(p.disease||''),labels=[];if(/\bDM\b|\bE1[0-4]\b|เบาหวาน/i.test(text))labels.push('DM');if(/\bHT\b|\bI10\b|ความดัน/i.test(text))labels.push('HT');return labels.length?labels.join(','):text;}
// ทำความสะอาดเฉพาะข้อความที่แสดงบนใบพิมพ์ โดยคงข้อมูลยาที่บันทึกไว้เดิม.
function cleanRxForPrint(text){return String(text||'').split('\n').map(line=>line.replace(/\b(?:p\.?c|a\.?c|h\.?s|o\.?d|b\.?i\.?d|t\.?i\.?d|q\.?i\.?d|p\.?r\.?n|p\.?o)\b\.?/gi,'').replace(/จำนวน\s*เม็ด\s*[:：]?\s*(?:\d+(?:\.\d+)?)?/g,'').replace(/จำนวน\s*[:：]?\s*\d+(?:\.\d+)?\s*(?:เม็ด|แคปซูล|caps?(?:ules?)?|tabs?(?:lets?)?)/gi,'').replace(/๏/g,'').replace(/\s+/g,' ').replace(/^[\s.,;:/]+|[\s.,;:/]+$/g,'').trim()).filter(Boolean).join('\n');}
function fitClinicalPrint(){const sheet=$('printsheet'),page=sheet?.querySelector('.clinical-page');if(!page)return;sheet.classList.add('print-sizing');page.style.zoom='1';const mm=document.createElement('div');mm.style.cssText='height:277mm;width:1mm;position:absolute;';sheet.append(mm);const height=mm.getBoundingClientRect().height;mm.remove();const scale=Math.min(1,(height-8)/Math.max(1,page.getBoundingClientRect().height));page.style.width='190mm';page.style.zoom=String(scale);sheet.classList.remove('print-sizing');}

// ใบพิมพ์ใช้ผลเลือดล่าสุดที่ตรงกับครั้งรับบริการ พร้อมวันที่จากรายงาน ไม่แทนค่าตรวจคนละวัน.
function dtxForDocument(p,v={},useRegistry=true){const has=value=>value!=null&&String(value).trim()!=='';if(has(v.glucose))return {value:String(v.glucose),source:'visit'};if(useRegistry&&has(p.glucose))return {value:String(p.glucose),source:'registry'};return {value:'',source:''};}
function clinicalLabReport(p,v){return labReportsForWord(p,v?.id?v:undefined)[0];}
function clinicalLabBlock(p,v){const report=clinicalLabReport(p,v);return report?`<div class="clinical-pdf-labs"><b>ผลเลือดจาก PDF</b><div>${paperValue(wordLabSummary(report.summary)||'ไม่พบรายการตรวจที่ตรงกับช่องในแบบฟอร์ม')}</div><small>ต้นฉบับ: ${esc(report.filename)}</small></div>`:'';}
function clinicalEncounter(p,v={},position=0){const val=k=>paperValue(k==='medicines'?cleanRxForPrint(v[k]):v[k],['weight','height','waist','temp','pulse','resp','spo2','bp','bp2','glucose','hba1c'].includes(k)?6:['habits','cvd','foot','dental','diet','exercise'].includes(k)?12:40),caseText=clinicalCase(p),adherence=String(v.adherence||'').trim(),deniedSurgery=/^(ปฏิเสธ|ไม่มี)$/.test(v.surgery||'');return `<table class="clinical-form" aria-label="แบบบันทึกการตรวจครั้งที่ ${position+1}"><colgroup><col style="width:13%"><col style="width:15%"><col style="width:21%"><col style="width:51%"></colgroup><tbody><tr><td class="clinical-appointment"><div>Case ${paperValue(caseText)}</div><p>${printCheck(v.status==='ตามนัด')} มาตามนัด</p><p>${printCheck(v.status==='ก่อนนัด')} ก่อนนัด</p><p>${printCheck(v.status==='หลังนัด')} หลังนัด</p></td><td class="clinical-measures"><p>น้ำหนัก ${val('weight')} กก.</p><p>ส่วนสูง ${val('height')} ซม.</p><p>รอบเอว ${val('waist')} ซม.</p></td><td class="clinical-vitals"><div>สัญญาณชีพ</div><p>T = ${val('temp')} °C</p><p>P = ${val('pulse')} /min</p><p>R = ${val('resp')} /min</p><p>BP = ${val('bp')} mmHg</p><p>BP ซ้ำ = ${val('bp2')} mmHg</p>${v.spo2?`<p>SpO₂ = ${val('spo2')} %</p>`:''}</td><td rowspan="2" class="clinical-treatment"><p class="clinical-exam-date">วันที่ตรวจ ${v.date?dateTH(v.date):'...................................................'}</p><p>Lab &nbsp; DTX ${paperValue(dtxForDocument(p,v).value,6)} mg/dL &nbsp; HbA1c ${val('hba1c')} %</p>${dtxForDocument(p,v).source==='registry'?'<p class="clinical-dtx-source"><small>DTX จากทะเบียน Excel · ไม่ยืนยันวันที่ตรวจ</small></p>':''}${clinicalLabReport(p,v)?clinicalLabBlock(p,v):'<p>DTX ซ้ำ ................ mg/dL &nbsp; เวลา ................ น.</p><p>Urine protein ............ MAU ............ BUN ............ Cr ............</p><p>Chol ........ TG ........ HDL ........ LDL ........ GFR ........</p>'}${v.labs?`<div class="clinical-extra-labs">ผล Lab ที่บันทึก: ${val('labs')}</div>`:''}<div class="clinical-diagnosis">Dx ${val('diagnosis')}</div><div class="clinical-rx"><div class="clinical-rx-date">Rx : &nbsp; วันที่มารับบริการ ${dateTH(v.date||today())}</div>${v.medicines?`<div class="clinical-prescription">${val('medicines')}</div>`:''}${Array.from({length:clinicalLabReport(p,v)?2:(v.medicines?8:10)},()=>'<div class="clinical-rule">........................................................................................</div>').join('')}</div>${v.plan?`<div class="clinical-plan">แผนดูแล / ส่งต่อ: ${val('plan')}</div>`:''}<div class="clinical-treatment-footer"><p>วันนัด ${v.nextDate?dateTH(v.nextDate):'................................................'} เวลากลับ ............ น.</p><p>ชื่อ ${val('clinician')} ผู้ตรวจ</p></div></td></tr><tr><td colspan="3" class="clinical-history"><p>อาการที่พบ &nbsp; ${printCheck(v.cc==='ไม่มีอาการผิดปกติ')} ไม่มีอาการผิดปกติ</p><p>CC: ${val('cc')}</p><p>PI: ${val('pi')}</p><p>PE: ${v.pe?val('pe'):'HEENT: ........ HEART: ........ LUNG: ........ Abd: ........'}</p><p>การใช้ยา &nbsp; ${printCheck(adherence==='ถูกต้อง')} ถูกต้อง &nbsp; ${printCheck(adherence==='ไม่ถูกต้อง')} ไม่ถูกต้อง ${adherence&&!['ถูกต้อง','ไม่ถูกต้อง'].includes(adherence)?val('adherence'):'........................'}</p><p>โรคประจำตัว ${paperValue(caseText)}</p><p>ผ่าตัด ${printCheck(deniedSurgery)} ปฏิเสธ &nbsp; ${printCheck(!!v.surgery&&!deniedSurgery)} มี ${!deniedSurgery?val('surgery'):'........................'}</p><p>บุหรี่ / สุรา ${val('habits')} &nbsp; CVD Risk ${val('cvd')}</p><p>การคุมอาหาร ${val('diet')} การออกกำลังกาย ${val('exercise')}</p><p>การตรวจเท้า ${val('foot')} การตรวจฟัน ${val('dental')}</p><p>การตรวจอื่น ๆ ${val('other')}</p><p>ชื่อ ${val('recorder')} ผู้ซักประวัติ &nbsp; เวลา ........ น.</p>${v.channel?`<p>ช่องทาง: ${val('channel')}</p>`:''}</td></tr></tbody></table>`;}
function buildClinicalPrint(p,selectedVisit){let visits=selectedVisit?[selectedVisit]:state.visits.filter(v=>v.patientId===p.id).sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt)).slice(0,1);if(!visits.length)visits=[{diagnosis:p.disease,medicines:medicationProfile(p.id)?.medicines||''}];const profile=medicationProfile(p.id),changed=!selectedVisit&&profile&&visits[0].date&&visits[0].medicines!==profile.medicines;return visits.map((v,i)=>`<section class="clinical-page">${clinicalHeader(p)}${clinicalEncounter(p,v,i)}<footer class="clinical-page-footer">${i===0?`<div>ค่าทะเบียนเดิม (ไม่ยืนยันวันที่ตรวจ): BP ${paperValue(p.bp)} · BP ซ้ำ ${paperValue(p.bp2)} · DTX ${paperValue(p.glucose)}</div>${p.notes?`<div>หมายเหตุ: ${paperValue(p.notes)}</div>`:''}${changed?`<div>ยาประจำปัจจุบัน ณ ${dateTH(today())}: ${paperValue(cleanRxForPrint(profile.medicines))}</div>`:''}`:''}<div>TLM206 · ${esc(p.group)} · โทร ${paperValue(p.phone)} · ผู้ดูแล ${paperValue(p.caregiver)} · พิมพ์ ${dateTH(today())}</div></footer></section>`).join('');}
async function printPatient(p,v){if(!p)return;const epoch=state.sessionEpoch;try{await loadPrivate();if(epoch!==state.sessionEpoch)return;p=state.patients.find(x=>x.id===p.id)||p;if(v)v=state.visits.find(x=>x.id===v.id)||v;}catch(e){toast('โหลดข้อมูลล่าสุดก่อนพิมพ์ไม่สำเร็จ: '+e.message,true);return;}$('printsheet').innerHTML=buildClinicalPrint(p,v);$('printsheet').classList.add('print-sizing');await document.fonts.ready;fitClinicalPrint();window.print();}

window.addEventListener('afterprint',()=>$('printsheet').replaceChildren());$('menu').onclick=()=>$('sidebar').classList.toggle('open');$('account').onclick=async()=>{if(!state.token)return render('login');if(!await confirmAction('ออกจากระบบ','สิ้นสุดการเข้าถึงข้อมูลผู้ป่วยในหน้าต่างนี้'))return;try{await api('logout');}catch(e){}clearPrivate();render('dashboard');};
render('dashboard');if(apiUrl)refreshDashboard();
</script></body></html>
